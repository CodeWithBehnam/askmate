name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Build, attest, and publish release
    # Pinned instead of ubuntu-latest, which moves to a new image from 19 October 2026. Bump it on purpose, not by surprise.
    runs-on: ubuntu-24.04
    permissions:
      # Publishing the release needs contents: write; the provenance attestation needs id-token and attestations.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version triad
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(bun -e "console.log(require('./manifest.json').version)")"
          MANIFEST_MIN_APP_VERSION="$(bun -e "console.log(require('./manifest.json').minAppVersion)")"
          PACKAGE_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          HAS_VERSIONS_ENTRY="$(bun -e "const v=require('./versions.json'); console.log(Object.prototype.hasOwnProperty.call(v, process.argv[1]) ? 'yes' : 'no')" "$VERSION")"
          VERSIONS_MIN_APP_VERSION="$(bun -e "const v=require('./versions.json'); console.log(String(v[process.argv[1]]))" "$VERSION")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $VERSION does not match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [ "$HAS_VERSIONS_ENTRY" != "yes" ]; then
            echo "versions.json is missing an entry for $VERSION" >&2
            exit 1
          fi
          # Obsidian reads versions.json to offer older app versions a compatible release, so it must agree with the manifest.
          if [ "$VERSIONS_MIN_APP_VERSION" != "$MANIFEST_MIN_APP_VERSION" ]; then
            echo "versions.json maps $VERSION to $VERSIONS_MIN_APP_VERSION, but manifest minAppVersion is $MANIFEST_MIN_APP_VERSION" >&2
            exit 1
          fi

      # The release body is the CHANGELOG.md section for this tag, so users read what changed and not only a compare link.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "CHANGELOG.md has no entry for $VERSION. Add a '## [$VERSION] - YYYY-MM-DD' section before tagging." >&2
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Type-check tests
        run: bun run typecheck:tests

      - name: Run tests
        run: bun run test

      - name: Build plugin
        run: bun run build

      - name: Inspect release bundle
        run: bun run scripts/roadmap-smoke-tests.ts --bundle

      # Attestation succeeds with a partial match, so check every asset on its own first.
      - name: Check release assets exist
        shell: bash
        run: |
          for file in main.js manifest.json styles.css; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty release asset: $file" >&2
              exit 1
            fi
          done

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: AskMate ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          # Appends GitHub's compare link and contributor list after the CHANGELOG section.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
