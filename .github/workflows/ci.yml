name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    name: Lint, test and build
    # Pinned instead of ubuntu-latest, which moves to a new image from 19 October 2026. Bump it on purpose, not by surprise.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Obsidian community review rules, run locally so a violation fails here and not after a tag.
      - name: Lint
        run: bun run lint

      - name: Type-check tests
        run: bun run typecheck:tests

      - name: Run tests
        run: bun run test

      - name: Build plugin
        run: bun run build

      # Looks at the built main.js: allowed require() list, no source map, no eval, size ceiling.
      - name: Inspect release bundle
        run: bun run scripts/roadmap-smoke-tests.ts --bundle
