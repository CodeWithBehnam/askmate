<title id="title">AskMate: ask your notes anything</title>
<desc id="desc">The AskMate sidebar in Obsidian. A question about a note is answered with a Mermaid diagram card that shows its syntax is valid, and an MCP tool request waits for approval with Allow once, Allow for this chat and Deny.</desc>
